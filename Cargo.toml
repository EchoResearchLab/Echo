[workspace]
resolver = "3"
members = [
    # 工程任务单入口（check / web / e2e / migrate / frozen / release）。
    "xtask",

    # ── core：纯内核，不碰 IO ────────────────────────────────────────────
    "crates/core/finance-core",      # 定点金融算术（Money / Decimal）
    "crates/core/echo-contracts",    # HTTP 与 WASM 共用的 serde 契约
    "crates/core/echo-domain",       # 研究规则：意图路由 · 估值 · 数字护栏

    # ── platform：工程底座 ──────────────────────────────────────────────
    "crates/platform/echo-config",         # 服务端环境配置唯一入口
    "crates/platform/echo-observability",  # tracing / OTLP 初始化

    # ── agent：研究智能体 ───────────────────────────────────────────────
    "crates/agent/echo-application", # 编排 · 提示词 · 模型网关 · 研究记忆

    # ── database / datasource：两个唯一出入口 ───────────────────────────
    "crates/database/echo-db",       # 持久化与多租户 RLS（sqlx）
    "crates/datasource/echo-data",   # 外部供应商路由 · 授权门 · 熔断

    # ── backend / frontend ─────────────────────────────────────────────
    "crates/backend/echo-api",       # axum HTTP/SSE 与认证
    "crates/backend/echo-worker",    # 后台作业与可恢复调度
    "crates/frontend/echo-web",      # Leptos/WASM 单页

    # ── qa ─────────────────────────────────────────────────────────────
    "crates/qa/echo-e2e",            # Rust WebDriver 浏览器验收
]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"
authors = ["Echo Research"]

# 集中依赖底账：版本只在这里钉一次，各 crate 用 `dep.workspace = true` 继承，
# 避免同一依赖在多个 crate 里漂移出不同版本（工作区级单一事实源）。
[workspace.dependencies]
echo-finance-core = { path = "crates/core/finance-core" }
echo-contracts = { path = "crates/core/echo-contracts" }
echo-config = { path = "crates/platform/echo-config" }
echo-observability = { path = "crates/platform/echo-observability" }
echo-domain = { path = "crates/core/echo-domain" }
echo-application = { path = "crates/agent/echo-application" }
echo-db = { path = "crates/database/echo-db" }
echo-data = { path = "crates/datasource/echo-data" }

rust_decimal = { version = "1.36", default-features = false, features = ["serde", "std"] }
rust_decimal_macros = "1.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
subtle = "2"
uuid = { version = "1", features = ["v4"] }
# 模型网关的 HTTP 客户端：rustls 与 sqlx 的 tls-rustls 对齐（不引 OpenSSL）；
# 只用 json + 流式 body，OpenAI 兼容协议（DeepSeek/OpenAI）。
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "json",
    "stream",
] }
url = "2"
regex = "1"
pdf-extract = "=0.10.0"
fantoccini = { version = "0.22", default-features = false, features = ["rustls-tls"] }
# 每请求 tracing span（OTLP 追踪导出的数据来源，见 echo-observability）。
tower-http = { version = "0.6", default-features = false, features = ["trace"] }
# 简报邮件通道：tokio1 异步 SMTP + rustls，与项目其余 TLS 客户端一致（不引 OpenSSL）。
lettre = { version = "0.11", default-features = false, features = [
    "tokio1",
    "tokio1-rustls-tls",
    "smtp-transport",
    "builder",
] }
# 备份归档 S3 镜像通道：官方 aws-sdk-s3/aws-config 传递依赖（aws-sdk-sts 1.9x）要求
# rustc 1.88，高于本仓库 1.85 底线（rust-toolchain.toml / CI 均钉 1.85，不在本次单一
# 能力切片里顺带升级工具链）；改用 reqwest 直连 S3 REST API + 手签 SigV4（hmac/sha2/hex
# 已在工作区内，RustCrypto 同源，无新增 MSRV 风险）。
hmac = "0.12"
# OTLP 可观测性导出（可选，ECHO_OTLP_ENDPOINT 未配就完全不初始化，见 echo-observability）。
# reqwest-client 走 opentelemetry-otlp 自带的 reqwest 依赖（default-features=false，不带
# TLS 后端）——本次只支持明文 HTTP 收集端（本地/同网 sidecar collector 的常见形态），
# HTTPS 收集端需要额外 TLS 后端选型，不在本次范围内。
opentelemetry = { version = "0.32", default-features = false, features = [
    "trace",
] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = [
    "trace",
    "rt-tokio",
    "experimental_trace_batch_span_processor_with_async_runtime",
] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = [
    "http-proto",
    "reqwest-client",
    "trace",
] }
tracing-opentelemetry = { version = "0.33", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
